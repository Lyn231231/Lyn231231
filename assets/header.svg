<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="'Segoe UI',-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" fill="url(#bg)" rx="14"/>
  <g stroke="#1f2933" stroke-width="1">
    <line x1="0" y1="50" x2="880" y2="50"/>
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="150" x2="880" y2="150"/>
  </g>

  <!-- rack of service units, each with its own heartbeat -->
  <g transform="translate(40,18)">
    <g>
      <rect x="0" y="0" width="90" height="14" rx="3" fill="#161b22" stroke="#2dd4bf" stroke-width="1"/>
      <circle cx="8" cy="7" r="3" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="16" y="5" width="60" height="4" rx="2" fill="#2dd4bf" opacity="0.55"/>
    </g>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="90" height="14" rx="3" fill="#161b22" stroke="#2dd4bf" stroke-width="1"/>
      <circle cx="8" cy="7" r="3" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="16" y="5" width="44" height="4" rx="2" fill="#2dd4bf" opacity="0.4"/>
    </g>
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="90" height="14" rx="3" fill="#161b22" stroke="#2dd4bf" stroke-width="1"/>
      <circle cx="8" cy="7" r="3" fill="#d29922">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <rect x="16" y="5" width="52" height="4" rx="2" fill="#2dd4bf" opacity="0.45"/>
    </g>
    <g transform="translate(0,60)">
      <rect x="0" y="0" width="90" height="14" rx="3" fill="#161b22" stroke="#2dd4bf" stroke-width="1"/>
      <circle cx="8" cy="7" r="3" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.9s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="16" y="5" width="70" height="4" rx="2" fill="#2dd4bf" opacity="0.6"/>
    </g>
  </g>

  <!-- backup stream: dots moving along a line into an archive box -->
  <g transform="translate(150,26)">
    <line x1="0" y1="39" x2="330" y2="39" stroke="#22303c" stroke-width="2"/>
    <circle r="3" fill="#2dd4bf">
      <animate attributeName="cx" values="0;330" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2dd4bf" opacity="0.7">
      <animate attributeName="cx" values="0;330" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#3fb950" opacity="0.6">
      <animate attributeName="cx" values="0;330" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="336" y="22" width="60" height="36" rx="6" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="366" y="45" text-anchor="middle" fill="#2dd4bf" font-size="12" font-family="monospace">snap</text>
  </g>

  <!-- command prompt card: health check flipping between OK and FAIL -->
  <g transform="translate(640,18)">
    <rect width="200" height="76" rx="8" fill="#0b1217" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="12" y="22" fill="#7d8590" font-size="11" font-family="monospace">$ selfhost doctor</text>
    <g font-family="monospace" font-size="11">
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.9;0.95" dur="6s" repeatCount="indefinite"/>
        <text x="12" y="42" fill="#3fb950">ok   compose     4/4 up</text>
        <text x="12" y="58" fill="#3fb950">ok   backups     2h ago</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.9;0.95" dur="6s" repeatCount="indefinite"/>
        <text x="12" y="42" fill="#f85149">warn volume    1 unattached</text>
        <text x="12" y="58" fill="#d29922">warn cert      expires 6d</text>
      </g>
    </g>
  </g>

  <!-- scanning sweep across the bottom -->
  <rect x="0" y="176" width="180" height="3" fill="url(#scan)">
    <animate attributeName="x" values="-180;880" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- name + role + tags -->
  <text x="40" y="132" fill="#e6edf3" font-size="36" font-weight="700">Ivo Marsh</text>
  <text x="42" y="162" fill="#2dd4bf" font-size="18" font-weight="500">Infrastructure &amp; self-hosting @ LynxFlow</text>
  <text x="440" y="162" fill="#8b949e" font-size="15">· docker · backups · certs · disk</text>
  <rect x="40" y="170" width="10" height="20" fill="#2dd4bf">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
